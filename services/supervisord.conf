[supervisord]
nodaemon=true

[program:apt-cacher-ng]
command=/usr/sbin/apt-cacher-ng ForeGround=1
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:zot]
command=/usr/local/bin/zot serve /etc/swe-cache/zot.json
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
